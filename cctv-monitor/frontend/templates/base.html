<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CCTV Monitor{% endblock %} — IT Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#080c14;--bg2:#0d1422;--bg3:#111a2e;
  --panel:#0f1929;--border:#1e3a5f;
  --online:#00ff9d;--offline:#ff3b5c;--inter:#ffb830;
  --accent:#00c4ff;--accent2:#7b2fff;
  --text:#c8dff0;--text2:#5a7a99;--white:#e8f4ff;
  --font:'Exo 2',sans-serif;--mono:'Share Tech Mono',monospace;
  --glow:0 0 20px rgba(0,196,255,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;overflow-x:hidden}

/* ── Sidebar ── */
.sidebar{width:240px;min-height:100vh;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100;
  box-shadow:4px 0 30px rgba(0,0,0,.5)}
.sidebar-brand{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.sidebar-brand .brand-icon{font-size:1.4rem;color:var(--accent);margin-bottom:8px}
.sidebar-brand h2{font-size:.95rem;font-weight:700;color:var(--white);letter-spacing:.08em;line-height:1.3}
.sidebar-brand p{font-size:.65rem;color:var(--text2);letter-spacing:.12em;margin-top:4px;font-family:var(--mono)}
.sidebar-nav{padding:16px 0;flex:1}
.nav-section{padding:8px 16px 4px;font-size:.6rem;color:var(--text2);letter-spacing:.2em;font-weight:600;text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--text2);text-decoration:none;
  font-size:.82rem;font-weight:600;letter-spacing:.04em;transition:all .2s;border-left:3px solid transparent}
.nav-link i{width:18px;text-align:center;font-size:.9rem}
.nav-link:hover,.nav-link.active{color:var(--accent);background:rgba(0,196,255,.06);border-left-color:var(--accent)}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);font-size:.72rem;color:var(--text2)}
.sidebar-footer .user-badge{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sidebar-footer .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#fff}
.sidebar-footer .role-tag{font-family:var(--mono);font-size:.6rem;color:var(--online);letter-spacing:.1em}
.logout-btn{display:block;text-align:center;padding:7px;border:1px solid var(--border);border-radius:6px;
  color:var(--text2);text-decoration:none;font-size:.72rem;transition:all .2s}
.logout-btn:hover{color:var(--offline);border-color:var(--offline)}

/* ── Main ── */
.main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:1rem;font-weight:700;color:var(--white);letter-spacing:.04em}
.topbar-right{display:flex;align-items:center;gap:16px}
.live-badge{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.7rem;color:var(--online)}
.live-dot{width:7px;height:7px;background:var(--online);border-radius:50%;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.time-display{font-family:var(--mono);font-size:.78rem;color:var(--text2)}
.refresh-btn{background:rgba(0,196,255,.1);border:1px solid var(--accent);color:var(--accent);
  padding:6px 14px;border-radius:6px;font-size:.75rem;cursor:pointer;font-family:var(--mono);
  transition:all .2s;font-weight:600;letter-spacing:.05em}
.refresh-btn:hover{background:rgba(0,196,255,.2);box-shadow:var(--glow)}
.content{padding:24px 28px;flex:1}

/* ── Stat Cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;
  position:relative;overflow:hidden;transition:border-color .3s}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.green::before{background:var(--online)}
.stat-card.red::before{background:var(--offline)}
.stat-card.yellow::before{background:var(--inter)}
.stat-card.blue::before{background:var(--accent)}
.stat-card.purple::before{background:var(--accent2)}
.stat-card:hover{border-color:var(--accent)}
.stat-label{font-size:.68rem;color:var(--text2);letter-spacing:.12em;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-size:2rem;font-weight:900;color:var(--white);line-height:1;font-family:var(--mono)}
.stat-sub{font-size:.7rem;color:var(--text2);margin-top:6px}
.stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:2.4rem;opacity:.08}

/* ── Tables ── */
.table-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.table-header h3{font-size:.88rem;font-weight:700;color:var(--white);letter-spacing:.04em}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:11px 16px;text-align:left;font-size:.65rem;color:var(--text2);letter-spacing:.15em;
  font-weight:700;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg3)}
td{padding:12px 16px;font-size:.8rem;border-bottom:1px solid rgba(30,58,95,.4);color:var(--text);vertical-align:middle}
tr:hover td{background:rgba(0,196,255,.03)}
tr:last-child td{border-bottom:none}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.06em}
.badge-online{background:rgba(0,255,157,.12);color:var(--online);border:1px solid rgba(0,255,157,.3)}
.badge-offline{background:rgba(255,59,92,.12);color:var(--offline);border:1px solid rgba(255,59,92,.3)}
.badge-inter{background:rgba(255,184,48,.12);color:var(--inter);border:1px solid rgba(255,184,48,.3)}
.badge-open{background:rgba(255,59,92,.12);color:var(--offline);border:1px solid rgba(255,59,92,.3)}
.badge-progress{background:rgba(255,184,48,.12);color:var(--inter);border:1px solid rgba(255,184,48,.3)}
.badge-resolved{background:rgba(0,255,157,.12);color:var(--online);border:1px solid rgba(0,255,157,.3)}
.badge-closed{background:rgba(90,122,153,.12);color:var(--text2);border:1px solid rgba(90,122,153,.3)}
.badge-low{background:rgba(0,196,255,.1);color:var(--accent)}
.badge-medium{background:rgba(255,184,48,.1);color:var(--inter)}
.badge-high{background:rgba(255,100,50,.1);color:#ff6432}
.badge-critical{background:rgba(255,59,92,.15);color:var(--offline);animation:critpulse 1.5s infinite}
@keyframes critpulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── Signal Bar ── */
.signal-bar{display:flex;align-items:flex-end;gap:2px;height:16px}
.signal-bar span{width:5px;border-radius:2px;background:var(--border)}
.signal-bar span.active{background:var(--online)}
.signal-bar span.warn{background:var(--inter)}
.signal-bar span.bad{background:var(--offline)}

/* ── Progress Bar ── */
.prog-wrap{display:flex;align-items:center;gap:8px}
.prog-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.prog-ok{background:var(--online)}
.prog-warn{background:var(--inter)}
.prog-crit{background:var(--offline)}
.prog-label{font-size:.68rem;color:var(--text2);white-space:nowrap;font-family:var(--mono);min-width:36px;text-align:right}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;width:500px;max-width:94vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:1rem;font-weight:700;color:var(--white);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.7rem;color:var(--text2);letter-spacing:.1em;margin-bottom:6px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{
  width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;color:var(--white);font-family:var(--font);font-size:.82rem;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group select option{background:var(--panel)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:9px 20px;border-radius:8px;border:none;font-size:.8rem;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:all .2s}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{filter:brightness(1.15)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ── Filter Bar ── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar input,.filter-bar select{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;color:var(--text);font-family:var(--font);font-size:.8rem;outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent)}
.filter-bar input{flex:1;min-width:180px}
.add-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 16px;
  font-size:.78rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px}
.add-btn:hover{filter:brightness(1.15)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="fas fa-video"></i></div>
    <h2>CCTV Unified Monitor</h2>
    <p>IT CELL · GOV PLATFORM</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Navigation</div>
    <a href="/" class="nav-link {% if request.endpoint=='index' %}active{% endif %}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="/cameras" class="nav-link {% if request.endpoint=='cameras_page' %}active{% endif %}"><i class="fas fa-camera"></i> Cameras</a>
    <a href="/map" class="nav-link {% if request.endpoint=='map_page' %}active{% endif %}"><i class="fas fa-map-marked-alt"></i> Geo Map</a>
    <a href="/tickets" class="nav-link {% if request.endpoint=='tickets_page' %}active{% endif %}"><i class="fas fa-ticket-alt"></i> Tickets</a>
    <a href="/reports" class="nav-link {% if request.endpoint=='reports_page' %}active{% endif %}"><i class="fas fa-chart-bar"></i> Reports</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-badge">
      <div class="avatar">{{ user[0].upper() }}</div>
      <div>
        <div style="color:var(--white);font-weight:600;font-size:.78rem">{{ user }}</div>
        <div class="role-tag">{{ role.upper() }}</div>
      </div>
    </div>
    <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>
    <div class="topbar-right">
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      <div class="time-display" id="clock">--:--:--</div>
      <button class="refresh-btn" onclick="doRefresh()"><i class="fas fa-sync-alt"></i> REFRESH</button>
    </div>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</main>

<script>
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-IN',{hour12:false});
}
setInterval(updateClock,1000); updateClock();

function doRefresh(){
  fetch('/api/simulate_refresh').then(r=>r.json()).then(d=>{
    console.log('Refreshed',d.refreshed,'cameras at',d.time);
    if(typeof onRefresh==='function') onRefresh();
  });
}
setInterval(doRefresh, 30000); // auto-refresh every 30s
</script>
{% block scripts %}{% endblock %}
</body>
</html>
