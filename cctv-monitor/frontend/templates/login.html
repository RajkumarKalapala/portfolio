<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — CCTV Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--panel:#0f1929;--border:#1e3a5f;--accent:#00c4ff;--text:#c8dff0;--text2:#5a7a99;--white:#e8f4ff;--online:#00ff9d;--offline:#ff3b5c;--mono:'Share Tech Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Exo 2',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,196,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,196,255,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.glow-orb{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,196,255,.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:44px 40px;width:420px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.card::before{content:'';position:absolute;top:0;left:30px;right:30px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:2px}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:2.4rem;color:var(--accent);margin-bottom:10px}
.logo h1{font-size:1.3rem;font-weight:900;color:var(--white);letter-spacing:.06em}
.logo p{font-size:.68rem;color:var(--text2);letter-spacing:.18em;margin-top:4px;font-family:var(--mono)}
.form-group{margin-bottom:18px}
label{display:block;font-size:.68rem;color:var(--text2);letter-spacing:.14em;font-weight:700;margin-bottom:7px;text-transform:uppercase}
input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--white);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,196,255,.1)}
.submit-btn{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;padding:13px;font-size:.9rem;font-weight:800;letter-spacing:.06em;cursor:pointer;transition:all .2s;margin-top:6px}
.submit-btn:hover{filter:brightness(1.1);box-shadow:0 0 24px rgba(0,196,255,.4)}
.error{background:rgba(255,59,92,.12);border:1px solid rgba(255,59,92,.3);color:#ff3b5c;padding:10px 14px;border-radius:8px;font-size:.78rem;margin-bottom:16px;text-align:center}
.hints{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.hints p{font-size:.68rem;color:var(--text2);font-family:var(--mono);margin-bottom:6px;letter-spacing:.04em}
.hints span{color:var(--accent)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow-orb"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
    <h1>CCTV MONITOR</h1>
    <p>IT CELL · UNIFIED PLATFORM</p>
  </div>
  {% if error %}<div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required>
    </div>
    <button type="submit" class="submit-btn">SIGN IN <i class="fas fa-arrow-right"></i></button>
  </form>
  <div class="hints">
    <p>Demo accounts:  <span>admin / admin123</span></p>
    <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>operator / op123</span></p>
    <p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span>viewer / view123</span></p>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
