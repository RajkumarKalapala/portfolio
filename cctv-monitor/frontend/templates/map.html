{% extends 'base.html' %}
{% block title %}Geo Map{% endblock %}
{% block page_title %}Geo-Tagged Camera Map{% endblock %}
{% block content %}
<style>
#map-container{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative}
#map-svg{width:100%;height:500px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)}
.map-legend{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:7px;font-size:.75rem;color:var(--text2)}
.legend-dot{width:12px;height:12px;border-radius:50%}
.map-tooltip{position:absolute;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;font-size:.78rem;pointer-events:none;z-index:10;min-width:200px;display:none}
.map-tooltip .tt-title{font-weight:700;color:var(--white);margin-bottom:6px;font-family:var(--mono)}
.map-tooltip .tt-row{display:flex;justify-content:space-between;gap:20px;margin-bottom:3px;color:var(--text2)}
.map-tooltip .tt-row span:last-child{color:var(--text)}
.cam-marker{cursor:pointer;transition:r .15s}
.cam-marker:hover{filter:brightness(1.4)}
#map-stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.map-stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 16px;
  font-size:.75rem;display:flex;align-items:center;gap:8px}
</style>

<div id="map-stats">
  <div class="map-stat"><span style="color:var(--online)">●</span> <span id="ms-online">— Online</span></div>
  <div class="map-stat"><span style="color:var(--offline)">●</span> <span id="ms-offline">— Offline</span></div>
  <div class="map-stat"><span style="color:var(--inter)">●</span> <span id="ms-inter">— Intermittent</span></div>
  <div class="map-stat"><i class="fas fa-map-marker-alt" style="color:var(--accent)"></i> <span id="ms-total">Loading...</span></div>
</div>

<div id="map-container">
  <div class="map-tooltip" id="tooltip"></div>
  <svg id="map-svg" viewBox="0 0 800 500"></svg>
  <div class="map-legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--online)"></div> Online</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--offline)"></div> Offline</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--inter)"></div> Intermittent</div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function latLonToSVG(lat,lon,cams){
  const lats=cams.map(c=>c.lat),lons=cams.map(c=>c.lon);
  const minLat=Math.min(...lats),maxLat=Math.max(...lats);
  const minLon=Math.min(...lons),maxLon=Math.max(...lons);
  const pad=50;
  const x=pad+(lon-minLon)/(maxLon-minLon||1)*(800-2*pad);
  const y=pad+(maxLat-lat)/(maxLat-minLat||1)*(500-2*pad);
  return {x,y};
}

function drawMap(cams){
  const svg=document.getElementById('map-svg');
  const colors={Online:'#00ff9d',Offline:'#ff3b5c',Intermittent:'#ffb830'};
  const tt=document.getElementById('tooltip');

  // Draw grid lines
  let html='';
  for(let i=0;i<=8;i++){
    html+=`<line x1="${i*100}" y1="0" x2="${i*100}" y2="500" stroke="rgba(30,58,95,.4)" stroke-width="1"/>`;
  }
  for(let i=0;i<=5;i++){
    html+=`<line x1="0" y1="${i*100}" x2="800" y2="${i*100}" stroke="rgba(30,58,95,.4)" stroke-width="1"/>`;
  }

  // Label
  html+=`<text x="400" y="490" fill="rgba(90,122,153,.6)" font-size="11" text-anchor="middle" font-family="Share Tech Mono,monospace">VIJAYAWADA CITY — CCTV DEPLOYMENT MAP</text>`;

  cams.forEach(c=>{
    const {x,y}=latLonToSVG(c.lat,c.lon,cams);
    const col=colors[c.status]||'#00c4ff';
    html+=`<circle class="cam-marker" cx="${x}" cy="${y}" r="10" fill="${col}" fill-opacity="0.15" stroke="${col}" stroke-width="2" data-id="${c.camera_id}"/>`;
    html+=`<circle cx="${x}" cy="${y}" r="4" fill="${col}" style="pointer-events:none"/>`;
    if(c.status==='Offline'){
      html+=`<circle cx="${x}" cy="${y}" r="14" fill="none" stroke="${col}" stroke-width="1.5" opacity="0.4" style="animation:ripple 2s infinite;pointer-events:none"/>`;
    }
    html+=`<text x="${x}" y="${y-14}" fill="rgba(200,223,240,.6)" font-size="9" text-anchor="middle" font-family="Share Tech Mono,monospace" style="pointer-events:none">${c.camera_id}</text>`;
  });
  svg.innerHTML=html;

  // Tooltip
  svg.querySelectorAll('.cam-marker').forEach(el=>{
    const cam=cams.find(c=>c.camera_id===el.dataset.id);
    el.addEventListener('mouseenter',e=>{
      const exp=new Date(cam.sim_expiry);const days=Math.round((exp-new Date())/(1000*86400));
      tt.innerHTML=`<div class="tt-title">${cam.camera_id}</div>
        <div class="tt-row"><span>Location</span><span>${cam.location}</span></div>
        <div class="tt-row"><span>Status</span><span style="color:${cam.status==='Online'?'var(--online)':cam.status==='Offline'?'var(--offline)':'var(--inter)'}">${cam.status}</span></div>
        <div class="tt-row"><span>Signal</span><span>${cam.signal}%</span></div>
        <div class="tt-row"><span>Provider</span><span>${cam.sim_provider}</span></div>
        <div class="tt-row"><span>Data</span><span>${cam.data_used}/${cam.data_limit} GB</span></div>
        <div class="tt-row"><span>SIM Expiry</span><span>${days<0?'EXPIRED':days+'d left'}</span></div>`;
      tt.style.display='block';
    });
    el.addEventListener('mousemove',e=>{
      const rect=document.getElementById('map-container').getBoundingClientRect();
      tt.style.left=(e.clientX-rect.left+12)+'px';
      tt.style.top=(e.clientY-rect.top-60)+'px';
    });
    el.addEventListener('mouseleave',()=>tt.style.display='none');
  });

  // Stats
  document.getElementById('ms-online').textContent=cams.filter(c=>c.status==='Online').length+' Online';
  document.getElementById('ms-offline').textContent=cams.filter(c=>c.status==='Offline').length+' Offline';
  document.getElementById('ms-inter').textContent=cams.filter(c=>c.status==='Intermittent').length+' Intermittent';
  document.getElementById('ms-total').textContent=cams.length+' total cameras';
}

function onRefresh(){fetch('/api/cameras').then(r=>r.json()).then(drawMap);}
onRefresh();
</script>
{% endblock %}
