{% extends 'base.html' %}
{% block title %}Tickets{% endblock %}
{% block page_title %}Repair Ticket Management{% endblock %}
{% block content %}

<div class="filter-bar">
  <input type="text" id="search" placeholder="🔍 Search ticket, camera, issue..." oninput="filterTickets()">
  <select id="fStatus" onchange="filterTickets()">
    <option value="">All Status</option>
    <option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option>
  </select>
  <select id="fPriority" onchange="filterTickets()">
    <option value="">All Priority</option>
    <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
  </select>
</div>

<div class="table-card">
  <div class="table-header">
    <h3 id="tkt-count"><i class="fas fa-ticket-alt" style="color:var(--accent);margin-right:8px"></i>Tickets</h3>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Ticket ID</th><th>Camera</th><th>Location</th><th>Issue</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>Created</th><th>Actions</th></tr>
      </thead>
      <tbody id="tkt-tbody"></tbody>
    </table>
  </div>
</div>

<!-- Update Modal -->
<div class="modal-overlay" id="updateModal">
  <div class="modal">
    <h3><i class="fas fa-edit" style="color:var(--accent)"></i> Update Ticket</h3>
    <div class="form-group"><label>Ticket ID</label><input id="u-tid" readonly></div>
    <div class="form-group"><label>Update Status</label>
      <select id="u-status"><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select>
    </div>
    <div class="form-group"><label>Notes / Resolution</label><textarea id="u-notes" rows="4" placeholder="Add update or resolution notes..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="submitUpdate()">Update Ticket</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
let allTickets=[];

function prioBadge(p){return `<span class="badge badge-${p.toLowerCase()}">${p}</span>`;}
function statusBadge(s){
  const m={Open:'open','In Progress':'progress',Resolved:'resolved',Closed:'closed'};
  return `<span class="badge badge-${m[s]||'open'}">${s}</span>`;
}

function renderTable(tkts){
  document.getElementById('tkt-tbody').innerHTML=tkts.map(t=>`
    <tr>
      <td><span style="font-family:var(--mono);color:var(--accent)">${t.ticket_id}</span></td>
      <td><span style="font-family:var(--mono);font-size:.78rem">${t.camera_id}</span></td>
      <td><span style="font-size:.78rem">${t.location}</span></td>
      <td>${t.issue}</td>
      <td>${prioBadge(t.priority)}</td>
      <td>${statusBadge(t.status)}</td>
      <td><span style="font-size:.75rem;color:var(--text2)">${t.assigned_to||'—'}</span></td>
      <td><span style="font-size:.7rem;font-family:var(--mono);color:var(--text2)">${t.created_at}</span></td>
      <td><button onclick="openUpdate('${t.ticket_id}','${t.status}')" style="background:rgba(0,196,255,.1);border:1px solid var(--accent);color:var(--accent);padding:5px 10px;border-radius:6px;font-size:.7rem;cursor:pointer"><i class="fas fa-edit"></i> Update</button></td>
    </tr>`).join('');
  document.getElementById('tkt-count').innerHTML=`<i class="fas fa-ticket-alt" style="color:var(--accent);margin-right:8px"></i>Tickets (${tkts.length})`;
}

function filterTickets(){
  const q=document.getElementById('search').value.toLowerCase();
  const st=document.getElementById('fStatus').value;
  const pr=document.getElementById('fPriority').value;
  renderTable(allTickets.filter(t=>{
    if(q&&!`${t.ticket_id} ${t.camera_id} ${t.issue} ${t.location}`.toLowerCase().includes(q)) return false;
    if(st&&t.status!==st) return false;
    if(pr&&t.priority!==pr) return false;
    return true;
  }));
}

function loadTickets(){
  fetch('/api/tickets').then(r=>r.json()).then(d=>{allTickets=d;filterTickets();});
}

function openUpdate(tid,status){
  document.getElementById('u-tid').value=tid;
  document.getElementById('u-status').value=status;
  document.getElementById('u-notes').value='';
  document.getElementById('updateModal').classList.add('open');
}

function submitUpdate(){
  fetch('/api/tickets/update',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ticket_id:document.getElementById('u-tid').value,status:document.getElementById('u-status').value,notes:document.getElementById('u-notes').value})
  }).then(r=>r.json()).then(d=>{if(d.success){closeModal();loadTickets();}});
}
function closeModal(){document.getElementById('updateModal').classList.remove('open');}
function onRefresh(){loadTickets();}
loadTickets();
</script>
{% endblock %}
